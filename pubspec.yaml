name: robotic_arm_app
description: Premium Futuristic Robotic Arm Control Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Navigation
  go_router: ^12.1.3

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.15.0

  # UI & Animations
  animate_do: ^3.1.2
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.65.0

  # Joystick
  flutter_joystick: ^0.0.4

  # Bluetooth Classic
  flutter_bluetooth_serial: ^0.4.0

  # Permissions
  permission_handler: ^11.1.0

  # Utils
  shared_preferences: ^2.2.2
  rxdart: ^0.27.7
  intl: ^0.18.1
  uuid: ^4.2.2

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.6.0
  wifi_scan: ^0.4.1+2
  connectivity_plus: ^7.1.1
  network_info_plus: ^8.1.0
  app_settings: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
